name: Python checks

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        project:
          - PROJECTS/pcap-traffic-summary
          - PROJECTS/phishing-url-detector
          - PROJECTS/file-integrity-monitor
          - PROJECTS/keylogger
          - PROJECTS/network-traffic-analyzer
          - PROJECTS/wifi-security-analyzer
          - PROJECTS/hash-cracker
          - PROJECTS/siem-dashboard
          - PROJECTS/threat-intelligence-aggregator
          - PROJECTS/ssl-tls-scanner
          - PROJECTS/password-policy-auditor
          - PROJECTS/docker-security-audit
          - PROJECTS/web-vulnerability-scanner
          - PROJECTS/cloud-asset-inventory
          - PROJECTS/tls-fingerprint-console
          - PROJECTS/crypto-toolkit
          - PROJECTS/scoped-assessment
          - PROJECTS/posture-assessment
          - PROJECTS/ad-attack-paths
          - PROJECTS/coverage-guided-fuzzer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Install project dependencies
        run: |
          if [ -f "${{ matrix.project }}/requirements.txt" ]; then
            python -m pip install -r "${{ matrix.project }}/requirements.txt"
          fi
      - name: Compile Python source
        run: python -m compileall -q "${{ matrix.project }}"
      - name: Run tests
        working-directory: ${{ matrix.project }}
        run: PYTHONPATH=. pytest -q tests

  windows-siem:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: PROJECTS/siem-dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install SIEM dependencies
        run: python -m pip install pytest -r requirements.txt
      - name: Compile SIEM source
        run: python -m compileall -q src
      - name: Test SIEM controls and native Windows Event Logs
        run: python -m pytest -q tests

  windows-wlan:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: PROJECTS/wifi-security-analyzer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Compile analyzer source
        run: python -m compileall -q src
      - name: Test Windows WLAN ABI and analyzer behavior
        run: python -m pytest -q tests
      - name: Enumerate native Windows WLAN interfaces
        shell: pwsh
        run: |
          $report = python -m src.cli interfaces --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report | ConvertFrom-Json | Out-Null
          Write-Output $report

  hostile-inputs:
    # Every project is exercised against input shaped the way its code expects, because
    # that is what its own samples are. This runs the other half: each project's own
    # sample, mutated so that one assumption at a time is broken. A project may refuse
    # any of them -- refusing is the answer -- but a traceback means the refusal
    # happened by luck rather than by design.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install every project's dependencies
        run: |
          python -m pip install --upgrade pytest
          for requirements in PROJECTS/*/requirements.txt; do
            python -m pip install -r "$requirements"
          done
      - name: Feed every project malformed input
        run: python scripts/hostile_inputs.py

  fuzzer-target:
    # Back on this platform, which is where it belongs: the target is compiled here and
    # the compiled target has to run here. It did not, and the reason was in the build
    # rather than in the fuzzer -- see the note on the runtime in src/build.py.
    #
    # The project is also in the matrix above, which imports and compiles it. This job is
    # the one that builds the target and runs it: the tests, the search that finds the
    # defect, and the exploit that takes control of the vulnerable build.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: PROJECTS/coverage-guided-fuzzer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install the test runner
        run: python -m pip install --upgrade pytest
      - name: Report the toolchain and the compiler
        run: |
          PYTHONPATH=. python -c "from src.build import describe; print(describe())"
          cc --version | head -1
      - name: Run the tests
        run: PYTHONPATH=. python -m pytest -q tests
      - name: Fuzz the target and show what it found
        run: |
          PYTHONPATH=. python -m src.cli fuzz --budget 30000 --seed 4 --out findings
          PYTHONPATH=. python -m src.cli report --findings findings/findings.json
      - name: Take control of the vulnerable build
        run: PYTHONPATH=. python -m src.cli exploit --out exploit-out
