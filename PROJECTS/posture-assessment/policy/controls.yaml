# The organisation's policy, as code.
#
# One control, defined once, checked against every environment it names. This is the
# whole point of the project: the alternative is a Docker rule in one tool, a
# Kubernetes rule in another and an IoT rule in a spreadsheet, which is three
# descriptions of one intention that drift apart the first time somebody changes
# one of them.
#
# Every control names the standard it comes from, so a reader can check the mapping
# rather than take it on trust. The references are:
#
#   CIS Docker Benchmark v1.6.0          -- container controls
#   CIS Kubernetes Benchmark v1.9.0      -- cluster controls
#   ISO/IEC 27001:2022 Annex A           -- the management-system controls
#   NIST CSF 2.0                         -- the function a control serves
#
# A control that names an environment it cannot actually check would be a claim
# rather than a control, so `applies_to` lists only the environments with a check
# behind it, and the loader refuses a control that names an environment nothing
# implements.

version: 1
organisation: Example Ltd

# Which environments the policy is enforced across. The assessment covers all of
# them from the same control set.
environments:
  - container
  - kubernetes
  - iac
  - iot

controls:

  # --- identity and privilege ------------------------------------------------

  - id: no-root-user
    title: Workloads do not run as root
    intent: >
      A workload that runs as root inside its boundary has the run of that boundary.
      The fix is a named unprivileged user, which costs nothing and removes an entire
      class of escalation in one line.
    applies_to: [container, kubernetes, iac]
    severity: high
    cis: "CIS Docker Benchmark v1.6.0 4.1"
    iso27001: "A.8.2 Privileged access rights"
    nist_csf: "PR.AA Identity, Authentication and Access Control"
    treatment: mitigate
    owner: platform-team
    remediation: >
      Add a USER instruction with a non-root account, and set runAsNonRoot with a
      numeric runAsUser so the cluster refuses a manifest that would run as root.

  - id: no-privileged-container
    title: Containers are not privileged
    intent: >
      A privileged container is a container with the host's capabilities. It exists to
      run things that need the host, and if nothing here needs the host then this is a
      door left open for no reason.
    applies_to: [container, kubernetes]
    severity: critical
    cis: "CIS Docker Benchmark v1.6.0 5.4"
    iso27001: "A.8.2 Privileged access rights"
    nist_csf: "PR.PS Platform Security"
    treatment: mitigate
    owner: platform-team
    remediation: >
      Remove privileged: true. Where a specific capability is genuinely needed, grant
      that capability and nothing else, and drop all the others.

  - id: no-anonymous-access
    title: Services refuse anonymous access
    intent: >
      An unauthenticated interface is not an interface with a weak password; it is one
      with no password at all. On a network of small devices that is how one
      compromised sensor becomes every sensor.
    applies_to: [iot, kubernetes, iac]
    severity: critical
    cis: "CIS Kubernetes Benchmark v1.9.0 5.1.1"
    iso27001: "A.8.5 Secure authentication"
    nist_csf: "PR.AA Identity, Authentication and Access Control"
    treatment: mitigate
    owner: iot-team
    remediation: >
      Require authentication on every broker and API, and refuse the connection rather
      than granting it read-only access by default.

  - id: no-default-credentials
    title: Default credentials are not in use
    intent: >
      A default credential is published. It is in the manual, in the firmware image and
      in every list of them. It is not a weak credential, it is a known one.
    applies_to: [iot, container, iac]
    severity: critical
    cis: "CIS Docker Benchmark v1.6.0 4.1"
    iso27001: "A.8.5 Secure authentication"
    nist_csf: "PR.AA Identity, Authentication and Access Control"
    treatment: mitigate
    owner: iot-team
    remediation: >
      Force a change of the credential on first boot, or ship the device with none set
      and require one during commissioning.

  # --- exposure --------------------------------------------------------------

  - id: no-host-network
    title: Workloads do not share the host network
    intent: >
      Sharing the host's network namespace removes the boundary the container was
      supposed to provide. The container can then reach everything the host can, which
      is usually the reason it was isolated in the first place.
    applies_to: [container, kubernetes]
    severity: high
    cis: "CIS Docker Benchmark v1.6.0 5.10"
    iso27001: "A.8.20 Networks security"
    nist_csf: "PR.IR Technology Infrastructure Resilience"
    treatment: mitigate
    owner: platform-team
    remediation: >
      Remove network_mode: host and publish only the ports the workload serves.

  - id: no-exposed-management-port
    title: Management interfaces are not reachable from outside
    intent: >
      A management port on a public interface is an administrative interface anybody can
      reach. The exposure is the finding, whether or not the credential is strong.
    applies_to: [iot, iac, kubernetes]
    severity: high
    cis: "CIS Kubernetes Benchmark v1.9.0 5.2.2"
    iso27001: "A.8.20 Networks security"
    nist_csf: "PR.IR Technology Infrastructure Resilience"
    treatment: mitigate
    owner: network-team
    remediation: >
      Bind management interfaces to the management network or loopback, and reach them
      through a bastion rather than publishing them.

  # --- configuration and integrity -------------------------------------------

  - id: read-only-root-filesystem
    title: The root filesystem is read-only
    intent: >
      A workload that cannot write to its own filesystem cannot persist anything an
      attacker drops there. It is the cheapest containment available.
    applies_to: [container, kubernetes]
    severity: medium
    cis: "CIS Docker Benchmark v1.6.0 5.12"
    iso27001: "A.8.9 Configuration management"
    nist_csf: "PR.PS Platform Security"
    treatment: mitigate
    owner: platform-team
    remediation: >
      Set readOnlyRootFilesystem: true and mount a writable volume at the paths that
      genuinely need one.

  - id: no-latest-tag
    title: Images are pinned to a version, not to a moving tag
    intent: >
      A tag that moves means the artifact that was assessed is not the artifact that
      runs. Every other control in this policy is a statement about a specific image,
      and a floating tag makes that statement expire silently.
    applies_to: [container, kubernetes, iac]
    severity: medium
    cis: "CIS Docker Benchmark v1.6.0 4.7"
    iso27001: "A.8.9 Configuration management"
    nist_csf: "ID.AM Asset Management"
    treatment: mitigate
    owner: platform-team
    remediation: >
      Pin the image by digest, which cannot move, or at minimum by a specific version
      tag and a documented process for moving it.

  - id: firmware-update-path
    title: A supported firmware update path exists
    intent: >
      A device that cannot be updated is a device that will carry its vulnerabilities
      for its whole life. The update path is a security control, not a convenience.
    applies_to: [iot]
    severity: high
    cis: null
    iso27001: "A.8.8 Management of technical vulnerabilities"
    nist_csf: "ID.RA Risk Assessment"
    treatment: mitigate
    owner: iot-team
    remediation: >
      Publish signed firmware, verify the signature on the device before applying it,
      and commit to a support window long enough to matter.

  # --- governance ------------------------------------------------------------

  - id: resource-limits-set
    title: Workloads declare resource limits
    intent: >
      A workload with no limit can consume the node. That is an availability control
      before it is anything else, and it is also what stops one runaway process from
      taking the assessment environment down with it.
    applies_to: [container, kubernetes]
    severity: medium
    cis: "CIS Kubernetes Benchmark v1.9.0 5.2.2"
    iso27001: "A.8.6 Capacity management"
    nist_csf: "PR.IR Technology Infrastructure Resilience"
    treatment: mitigate
    owner: platform-team
    remediation: >
      Set requests and limits on every container, and set a namespace-level quota so a
      manifest without them is refused rather than admitted.

  - id: no-secrets-in-configuration
    title: Secrets are not written into configuration files
    intent: >
      A credential in a manifest is a credential in version control, in every clone, in
      every backup and in the history of every one of them. Removing the line does not
      remove it from any of those places.
    applies_to: [container, kubernetes, iac, iot]
    severity: critical
    cis: "CIS Docker Benchmark v1.6.0 4.10"
    iso27001: "A.8.24 Use of cryptography"
    nist_csf: "PR.DS Data Security"
    treatment: mitigate
    owner: security-team
    remediation: >
      Reference a secret store rather than a value, and rotate anything that was ever
      committed, because the history is not something a later commit can change.

  - id: least-privilege-iam
    title: Cloud identities are scoped to what they need
    intent: >
      A wildcard permission is a permission nobody has to think about, which is why it
      accumulates. The finding is not the wildcard itself but the absence of a decision
      behind it.
    applies_to: [iac, kubernetes]
    severity: high
    cis: "CIS Kubernetes Benchmark v1.9.0 5.1.3"
    iso27001: "A.8.2 Privileged access rights"
    nist_csf: "PR.AA Identity, Authentication and Access Control"
    treatment: mitigate
    owner: cloud-team
    remediation: >
      Replace wildcard actions and resources with the specific ones in use, and review
      the policy when the workload changes rather than granting the wildcard again.
