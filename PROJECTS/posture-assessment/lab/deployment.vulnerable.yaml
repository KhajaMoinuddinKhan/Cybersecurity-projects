# A Kubernetes manifest with the flaws the cluster controls look for.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      hostNetwork: true
      containers:
        - name: api
          image: myregistry/api:latest
          securityContext:
            privileged: true
          env:
            - name: JWT_SECRET
              value: "a-literal-token-that-should-be-a-secret-ref"
          ports:
            - containerPort: 8080
              hostPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: admin-console
spec:
  type: NodePort
  ports:
    - port: 22
      targetPort: 22
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: do-everything
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
